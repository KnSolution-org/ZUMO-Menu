<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zumo — Asian Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a18;
    --rice: #f5f2eb;
    --red: #c0392b;
    --muted: #7a7a72;
    --border: #e2ddd4;
    --card: #ffffff;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--rice); color: var(--ink); min-height: 100vh; padding-bottom: 120px; }

  header { background: var(--ink); color: white; text-align: center; padding: 14px 20px 14px; position: sticky; top: 0; z-index: 100; }
  header .brand { font-family: 'Playfair Display', serif; font-size: 2rem; letter-spacing: 4px; font-weight: 400; }
  header .sub { font-size: 0.72rem; letter-spacing: 3px; color: #aaa; margin-top: 2px; text-transform: uppercase; }

  .tabs { display: flex; overflow-x: auto; background: var(--ink); border-top: 1px solid #333; scrollbar-width: none; padding: 0 12px 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { flex-shrink: 0; padding: 8px 16px; border: 1px solid #444; background: transparent; color: #aaa; border-radius: 20px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; margin-right: 8px; white-space: nowrap; }
  .tab-btn.active { background: var(--red); border-color: var(--red); color: white; }

  .content { padding: 16px 14px 0; max-width: 700px; margin: 0 auto; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; color: var(--red); margin: 20px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); letter-spacing: 1px; }

  .menu-item { background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
  .item-info { flex: 1; }
  .item-code { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; margin-bottom: 2px; }
  .item-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
  .item-desc { font-size: 0.75rem; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 90px; }
  .item-price { font-weight: 700; font-size: 0.88rem; color: var(--ink); white-space: nowrap; }
  .item-price-small { font-size: 0.68rem; color: var(--muted); font-weight: 400; }

  .qty-control { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 20px; overflow: hidden; }
  .qty-btn { background: none; border: none; width: 30px; height: 28px; font-size: 1.1rem; cursor: pointer; color: var(--red); font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .qty-btn:active { background: #f0e8e8; }
  .qty-num { font-size: 0.85rem; font-weight: 700; min-width: 22px; text-align: center; }

  .add-btn { background: var(--red); color: white; border: none; border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  .add-btn:active { background: #a93226; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--ink); color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 200; box-shadow: 0 -4px 20px rgba(0,0,0,0.25); }
  .bar-info .bar-count { font-size: 0.75rem; color: #aaa; }
  .bar-info .bar-total { font-family: 'Playfair Display', serif; font-size: 1.3rem; }
  .bar-btn { background: var(--red); color: white; border: none; border-radius: 25px; padding: 12px 24px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.9rem; cursor: pointer; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 300; justify-content: flex-end; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 700px; margin: 0 auto; padding: 24px 20px 32px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1); position: relative; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 20px; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 18px; color: var(--ink); }
  .close-modal { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }

  .cart-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .cart-item-name { flex: 1; font-weight: 500; font-size: 0.9rem; }
  .cart-item-price { font-weight: 700; font-size: 0.9rem; min-width: 75px; text-align: right; }
  .cart-total-row { display: flex; justify-content: space-between; padding: 14px 0 4px; font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea { width: 100%; border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s; background: var(--rice); }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--red); }
  .form-group textarea { resize: vertical; min-height: 72px; }

  .order-type-toggle { display: flex; gap: 10px; }
  .toggle-btn { flex: 1; padding: 10px; border: 1.5px solid var(--border); border-radius: 10px; background: transparent; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.2s; }
  .toggle-btn.active { background: var(--red); border-color: var(--red); color: white; }

  .btn-full { width: 100%; padding: 15px; background: #25D366; color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-full:active { background: #1ebe5d; }
  .btn-ghost { width: 100%; padding: 13px; background: transparent; color: var(--ink); border: 1.5px solid var(--border); border-radius: 12px; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
  .btn-red { background: var(--red) !important; }
  .btn-red:active { background: #a93226 !important; }

  .empty { text-align: center; padding: 28px 0; color: var(--muted); font-size: 0.9rem; }
  .cat-section { display: none; }
  .cat-section.active { display: block; }
</style>
</head>

let cart = {};

function cartKey(item) { return item.code; }
function rs(n) { return 'Rs ' + n.toLocaleString(); }

function addItem(catKey, idx) {
  const item = MENU[catKey].items[idx];
  const k = cartKey(item);
  if (cart[k]) cart[k].qty++;
  else cart[k] = { item, qty: 1, catKey };
  updateUI();
  const btn = document.getElementById('add-' + catKey + '-' + idx);
  if (btn) { btn.textContent = '✓'; setTimeout(() => { btn.textContent = 'Add'; }, 700); }
}

function changeQty(catKey, idx, delta) {
  const item = MENU[catKey].items[idx];
  const k = cartKey(item);
  if (!cart[k]) return;
  cart[k].qty += delta;
  if (cart[k].qty <= 0) delete cart[k];
  updateUI();
}

function cartTotal() { return Object.values(cart).reduce((s, e) => s + e.item.price * e.qty, 0); }
function cartCount() { return Object.values(cart).reduce((s, e) => s + e.qty, 0); }

function updateUI() {
  const count = cartCount();
  document.getElementById('barCount').textContent = count + ' item' + (count !== 1 ? 's' : '');
  document.getElementById('barTotal').textContent = rs(cartTotal());

  Object.keys(MENU).forEach(catKey => {
    MENU[catKey].items.forEach((item, idx) => {
      const qty = cart[cartKey(item)] ? cart[cartKey(item)].qty : 0;
      const addBtn = document.getElementById('add-' + catKey + '-' + idx);
      const qtyCtrl = document.getElementById('qty-' + catKey + '-' + idx);
      const qtyNum = document.getElementById('qtynum-' + catKey + '-' + idx);
      if (!addBtn) return;
      addBtn.style.display = qty > 0 ? 'none' : '';
      qtyCtrl.style.display = qty > 0 ? 'flex' : 'none';
      if (qtyNum) qtyNum.textContent = qty;
    });
  });
}

function render() {
  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('menuContent');
  tabsEl.innerHTML = '';
  contentEl.innerHTML = '';

  Object.keys(MENU).forEach((catKey, ci) => {
    const cat = MENU[catKey];

    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (ci === 0 ? ' active' : '');
    btn.textContent = cat.emoji + ' ' + cat.label;
    btn.onclick = () => switchTab(catKey);
    btn.id = 'tab-' + catKey;
    tabsEl.appendChild(btn);

    const sec = document.createElement('div');
    sec.className = 'cat-section' + (ci === 0 ? ' active' : '');
    sec.id = 'sec-' + catKey;

    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = cat.emoji + ' ' + cat.label.toUpperCase();
    sec.appendChild(title);

    cat.items.forEach((item, idx) => {
      const el = document.createElement('div');
      el.className = 'menu-item';
      const priceLabel = item.price2
        ? rs(item.price) + ' <span class="item-price-small">/ ' + rs(item.price2) + '</span>'
        : rs(item.price);
      const unitLabel = item.unit ? ' <span class="item-price-small">(' + item.unit + ')</span>' : '';
      el.innerHTML =
        '<div class="item-info">' +
          '<div class="item-code">' + item.code + '</div>' +
          '<div class="item-name">' + item.name + unitLabel + '</div>' +
          '<div class="item-desc">' + item.desc + '</div>' +
        '</div>' +
        '<div class="item-right">' +
          '<div class="item-price">' + priceLabel + '</div>' +
          '<button class="add-btn" id="add-' + catKey + '-' + idx + '" onclick="addItem(\'' + catKey + '\',' + idx + ')">Add</button>' +
          '<div class="qty-control" id="qty-' + catKey + '-' + idx + '" style="display:none">' +
            '<button class="qty-btn" onclick="changeQty(\'' + catKey + '\',' + idx + ',-1)">−</button>' +
            '<span class="qty-num" id="qtynum-' + catKey + '-' + idx + '">1</span>' +
            '<button class="qty-btn" onclick="changeQty(\'' + catKey + '\',' + idx + ',1)">+</button>' +
          '</div>' +
        '</div>';
      sec.appendChild(el);
    });
    contentEl.appendChild(sec);
  });
}

function switchTab(catKey) {
  document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + catKey).classList.add('active');
  document.getElementById('tab-' + catKey).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openCart() {
  const cartItemsEl = document.getElementById('cartItems');
  const emptyEl = document.getElementById('cartEmpty');
  const totalRow = document.getElementById('cartTotalRow');
  const checkBtn = document.getElementById('checkoutBtn');
  const keys = Object.keys(cart);
  cartItemsEl.innerHTML = '';

  if (keys.length === 0) {
    emptyEl.style.display = '';
    totalRow.style.display = 'none';
    checkBtn.style.display = 'none';
  } else {
    emptyEl.style.display = 'none';
    totalRow.style.display = '';
    checkBtn.style.display = '';
    keys.forEach(k => {
      const { item, qty, catKey } = cart[k];
      const idx = MENU[catKey].items.findIndex(i => i.code === item.code);
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML =
        '<div class="cart-item-name">' + item.name + '</div>' +
        '<div class="qty-control" style="display:flex">' +
          '<button class="qty-btn" onclick="changeQty(\'' + catKey + '\',' + idx + ',-1);openCart()">−</button>' +
          '<span class="qty-num">' + qty + '</span>' +
          '<button class="qty-btn" onclick="changeQty(\'' + catKey + '\',' + idx + ',1);openCart()">+</button>' +
        '</div>' +
        '<div class="cart-item-price">' + rs(item.price * qty) + '</div>';
      cartItemsEl.appendChild(row);
    });
    document.getElementById('cartTotalAmt').textContent = rs(cartTotal());
  }
  document.getElementById('cartModal').classList.add('open');
}

function openDetails() {
  closeModal('cartModal');
  document.getElementById('detailsModal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

let orderType = 'delivery';

function setOrderType(type) {
  orderType = type;
  document.getElementById('btnPickup').classList.toggle('active', type === 'pickup');
  document.getElementById('btnDelivery').classList.toggle('active', type === 'delivery');
  document.getElementById('addressGroup').style.display = type === 'pickup' ? 'none' : '';
}

function placeOrder() {
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();

  if (!name || !phone) {
    alert('Please enter your name and mobile number.');
    return;
  }
  if (orderType === 'delivery' && !address) {
    alert('Please enter your delivery address.');
    return;
  }

  const now = new Date();
  const dateStr = now.toLocaleDateString('en-PK', { day:'2-digit', month:'short', year:'numeric' });
  const timeStr = now.toLocaleTimeString('en-PK', { hour:'2-digit', minute:'2-digit' });

  const itemLines = Object.values(cart)
    .map(({ item, qty }) => '• ' + item.name + ' × ' + qty + '  —  ' + rs(item.price * qty))
    .join('\n');

  const orderTypeLabel = orderType === 'pickup' ? '🏃 PICKUP' : '🛵 DELIVERY';

  let msg =
    '🍜 *New Order — Zümo Asian Kitchen*\n' +
    '📅 ' + dateStr + '  🕐 ' + timeStr + '\n' +
    '📦 Order Type: ' + orderTypeLabel + '\n\n' +
    '👤 *Customer Details*\n' +
    'Name: ' + name + '\n' +
    'Phone: ' + phone;

  if (orderType === 'delivery') {
    msg += '\nAddress: ' + address;
  }

  msg +=
    '\n\n🛒 *Order Items*\n' +
    itemLines + '\n\n' +
    '💰 *Total: ' + rs(cartTotal()) + '*\n\n' +
    '_Please confirm this order. Thank you! 🙏_';

  window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');

  // Reset everything
  cart = {};
  orderType = 'delivery';
  setOrderType('delivery');
  updateUI();
  closeModal('detailsModal');
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('custAddress').value = '';
  render();
}

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
});

render();
</script>
